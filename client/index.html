<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DeepSims</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Apple SD Gothic Neo', Pretendard, sans-serif; background: #14121a; color: #e8e2d8; overflow: hidden; }
    #app { display: grid; grid-template-columns: 1fr 300px; grid-template-rows: 48px 1fr; height: 100vh; }
    #topbar { grid-column: 1 / 3; display: flex; align-items: center; gap: 16px; padding: 0 16px; background: #1e1a26; border-bottom: 2px solid #35304a; }
    #topbar h1 { font-size: 18px; color: #ffd97a; letter-spacing: 1px; }
    #clock { font-variant-numeric: tabular-nums; font-size: 15px; color: #b8e0a0; }
    #status { font-size: 12px; color: #8a8498; margin-left: auto; }
    #game { position: relative; overflow: hidden; }
    #game canvas { display: block; }
    #sidebar { background: #1e1a26; border-left: 2px solid #35304a; display: flex; flex-direction: column; min-height: 0; }
    #sidebar h2 { font-size: 13px; padding: 10px 12px 6px; color: #ffd97a; }
    #feed { flex: 1; overflow-y: auto; padding: 0 12px 12px; font-size: 12px; line-height: 1.7; }
    #feed .ev { padding: 4px 6px; border-radius: 4px; margin-bottom: 3px; background: #262133; }
    #feed .ev .t { color: #8a8498; font-size: 10px; margin-right: 4px; }
    #feed .ev.warn { background: #3a2733; }
    #simpanel { position: absolute; left: 12px; bottom: 12px; width: 240px; background: rgba(30,26,38,.95); border: 2px solid #35304a; border-radius: 8px; padding: 12px; display: none; }
    #simpanel h3 { font-size: 15px; color: #ffd97a; margin-bottom: 8px; }
    .bar { display: flex; align-items: center; gap: 6px; margin-bottom: 5px; font-size: 11px; }
    .bar .label { width: 42px; color: #b6b0c4; }
    .bar .track { flex: 1; height: 8px; background: #14121a; border-radius: 4px; overflow: hidden; }
    .bar .fill { height: 100%; border-radius: 4px; }
    #money { font-size: 13px; color: #ffd97a; margin: 6px 0; }
    #action { font-size: 12px; color: #b8e0a0; margin-bottom: 8px; }
    #assigns { display: flex; flex-wrap: wrap; gap: 4px; }
    #assigns button { font-size: 11px; padding: 4px 8px; background: #35304a; color: #e8e2d8; border: 0; border-radius: 4px; cursor: pointer; }
    #assigns button:hover { background: #4a4266; }
    #modal { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; align-items: center; justify-content: center; z-index: 10; }
    #modal .box { width: 420px; max-height: 70vh; overflow-y: auto; background: #1e1a26; border: 2px solid #ffd97a; border-radius: 10px; padding: 20px; }
    #modal h2 { color: #ffd97a; font-size: 16px; margin-bottom: 10px; }
    #modal .content { font-size: 13px; line-height: 1.8; }
    #modal button { margin-top: 14px; padding: 6px 14px; background: #ffd97a; color: #14121a; border: 0; border-radius: 5px; cursor: pointer; font-weight: bold; }
  </style>
</head>
<body>
  <div id="app">
    <div id="topbar">
      <h1>DeepSims</h1>
      <div id="clock">Day 0 00:00</div>
      <div id="status">접속 중…</div>
    </div>
    <div id="game">
      <div id="simpanel">
        <h3 id="simname"></h3>
        <div class="bar"><span class="label">배고픔</span><div class="track"><div class="fill" id="b-hunger" style="background:#e8a94e"></div></div></div>
        <div class="bar"><span class="label">수면</span><div class="track"><div class="fill" id="b-energy" style="background:#7ab5e8"></div></div></div>
        <div class="bar"><span class="label">사교</span><div class="track"><div class="fill" id="b-social" style="background:#8fd48a"></div></div></div>
        <div class="bar"><span class="label">재미</span><div class="track"><div class="fill" id="b-fun" style="background:#c79ae8"></div></div></div>
        <div id="money"></div>
        <div id="action"></div>
        <div id="assigns">
          <button data-a="eat">밥 먹기</button>
          <button data-a="sleep">잠자기</button>
          <button data-a="work">일하기</button>
          <button data-a="socialize">수다</button>
          <button data-a="play">놀기</button>
        </div>
      </div>
    </div>
    <div id="sidebar">
      <h2>이벤트</h2>
      <div id="feed"></div>
    </div>
  </div>
  <div id="modal"><div class="box">
    <h2>부재중 리포트</h2>
    <div class="content" id="report"></div>
    <button onclick="document.getElementById('modal').style.display='none'">확인</button>
  </div></div>
  <script type="module" src="./main.js"></script>
</body>
</html>
