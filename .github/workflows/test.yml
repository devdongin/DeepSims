# §23.53 CI가 실제로 테스트를 돌린다.
#
# 3회차 성능 리뷰의 지적: "CI에는 LLM 리뷰 잡 2개뿐 — npm test조차 돌지 않는다."
# 736개 테스트를 짜 두고 아무도 자동으로 돌리지 않고 있었다. 그동안 초록/빨강은
# 사람이 손으로 돌린 마지막 한 번의 기억이었다.
name: 테스트

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      # 클라이언트 번들이 실제로 빌드되는지도 본다 — 문법 오류가 테스트를 통과할 수 있다.
      - run: npm run build
      - run: npm test
